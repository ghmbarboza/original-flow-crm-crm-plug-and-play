<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="VIA Flow CRM">
  <!-- Fundo navy arredondado (cor real da marca: --via-navy #0A1F3B) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1F3B"/>
      <stop offset="1" stop-color="#02162A"/>
    </linearGradient>
  </defs>
  <!-- Área segura maskable: o conteúdo fica dentro dos ~80% centrais -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Monograma "V" da marca VIA em branco -->
  <path d="M152 150 L256 372 L360 150 L312 150 L256 272 L200 150 Z" fill="#FFFFFF"/>
  <!-- Ponto/acento sob o V -->
  <circle cx="256" cy="392" r="14" fill="#FFFFFF"/>
</svg>
