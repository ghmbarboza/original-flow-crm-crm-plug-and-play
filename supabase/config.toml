project_id = "tvwhiyojgtbuwtuohdes"

# Formulário público de captura de leads: acessado por visitantes sem sessão,
# portanto sem verificação de JWT. A função usa service-role internamente.
[functions.submit-capture-form]
verify_jwt = false

# Dispatcher de automações: acionado por cron / Supabase Scheduled Function, não
# por usuário. Sem verificação de JWT — a chamada usa a service-role key e a função
# só lê a fila (automation_logs status='queued'), sempre escopada por org_id.
[functions.automation-dispatcher]
verify_jwt = false

# Webhook da Evolution API: quem chama é o servidor da Evolution, que não envia
# JWT do Supabase. A função usa service-role internamente e valida a instância
# pelo par (instance_name, apikey) antes de gravar qualquer coisa.
[functions.evolution-webhook]
verify_jwt = false

# Webhook da Meta (WhatsApp Cloud API): o GET é o desafio de verificação
# (hub.challenge, validado contra META_WEBHOOK_VERIFY_TOKEN) e o POST são os
# eventos. Ambos vêm da Meta, sem JWT do Supabase.
[functions.meta-webhook]
verify_jwt = false

# Callback do OAuth do Gmail: o Google redireciona o navegador para cá com
# `code` e `state`, sem Authorization. O `state` é o que amarra a sessão.
[functions.gmail-oauth-callback]
verify_jwt = false

# Dispatcher de follow-up: acionado por cron, não por usuário. A proteção é o
# header secreto x-cron-secret (FOLLOWUP_CRON_SECRET), verificado na função.
[functions.followup-dispatcher]
verify_jwt = false

# Webhook do Zernio (multicanal): quem chama é a plataforma Zernio, sem JWT do
# Supabase. A segurança é resolver a org pelo profileId e verificar a assinatura
# HMAC (X-Zernio-Signature) quando a org tem webhook_secret configurado.
[functions.zernio-webhook]
verify_jwt = false

# Webhook do Cal.com (agendamento): quem chama é o Cal.com, sem JWT do Supabase.
# A org vem de ?org= e nada é gravado sem integração calcom ativa para ela;
# com CALCOM_WEBHOOK_SECRET configurado, a assinatura HMAC também é exigida.
[functions.calcom-webhook]
verify_jwt = false
